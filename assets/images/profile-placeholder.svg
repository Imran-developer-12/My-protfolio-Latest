<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500" role="img" aria-label="Placeholder for your profile photograph">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111B2E"/>
      <stop offset="1" stop-color="#080D19"/>
    </linearGradient>
    <linearGradient id="ln" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3978FF"/>
      <stop offset="1" stop-color="#20D5D2"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#94AAC9" fill-opacity=".16"/>
    </pattern>
  </defs>

  <rect width="400" height="500" fill="url(#bg)"/>
  <rect width="400" height="500" fill="url(#dots)"/>

  <g fill="none" stroke="url(#ln)" stroke-opacity=".55">
    <circle cx="200" cy="196" r="74" stroke-width="1.4" stroke-dasharray="5 7"/>
    <path d="M96 402c14-64 52-96 104-96s90 32 104 96" stroke-width="1.4" stroke-dasharray="5 7"/>
  </g>

  <text x="200" y="212" text-anchor="middle" font-family="Space Grotesk, Segoe UI, sans-serif" font-size="72" font-weight="700" fill="url(#ln)" fill-opacity=".28">MI</text>

  <g font-family="JetBrains Mono, Consolas, monospace" text-anchor="middle">
    <text x="200" y="446" font-size="13" fill="#F4F7FF" letter-spacing="1">PROFILE PHOTO</text>
    <text x="200" y="470" font-size="10.5" fill="#A5B2C8" letter-spacing=".4">Drop your image at</text>
    <text x="200" y="486" font-size="10.5" fill="#20D5D2" letter-spacing=".4">assets/images/profile.jpg</text>
  </g>

  <rect x="1" y="1" width="398" height="498" fill="none" stroke="#94AAC9" stroke-opacity=".22"/>
</svg>
