    <rect x="60" y="110" width="330" height="150" rx="8" fill="none" stroke="#94AAC9" stroke-opacity=".22" stroke-dasharray="6 6"/>
    <rect x="410" y="110" width="330" height="66" rx="8" fill="none" stroke="#94AAC9" stroke-opacity=".22" stroke-dasharray="6 6"/>
