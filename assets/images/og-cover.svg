  <g font-family="Space Grotesk, Segoe UI, sans-serif" font-weight="700" letter-spacing="-4">
    <text x="86" y="290" font-size="104" fill="#F4F7FF">Muhammad Imran.</text>
  </g>

  <text x="90" y="360" font-family="Space Grotesk, Segoe UI, sans-serif" font-size="42" font-weight="500" fill="url(#g)">Full Stack Web Developer</text>

  <g font-family="Inter, Segoe UI, sans-serif" font-size="21" fill="#A5B2C8">
    <text x="90" y="430">Modern, responsive and user-friendly web experiences —</text>
    <text x="90" y="462">creative design paired with practical development.</text>
  </g>

  <g font-family="JetBrains Mono, Consolas, monospace" font-size="16" fill="#71809A" letter-spacing="2">
