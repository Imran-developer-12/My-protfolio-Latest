  </g>

  <rect x="90" y="576" width="1020" height="2" fill="url(#g)" opacity=".5"/>
  <text x="1110" y="150" text-anchor="end" font-family="Space Grotesk, Segoe UI, sans-serif" font-size="34" font-weight="700" fill="url(#g)" letter-spacing="8">M. IMRAN</text>
