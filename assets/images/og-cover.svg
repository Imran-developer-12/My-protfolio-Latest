<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="b" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1525"/>
      <stop offset="1" stop-color="#080D19"/>
    </linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3978FF"/>
      <stop offset="1" stop-color="#20D5D2"/>
    </linearGradient>
    <radialGradient id="glow" cx=".82" cy=".12" r=".7">
      <stop offset="0" stop-color="#3978FF" stop-opacity=".3"/>
      <stop offset="1" stop-color="#3978FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="gr" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0v60" fill="none" stroke="#94AAC9" stroke-opacity=".07"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#b)"/>
  <rect width="1200" height="630" fill="url(#gr)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <g font-family="JetBrains Mono, Consolas, monospace">
